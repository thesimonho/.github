name: Feature request
description: Suggest a new feature or an improvement to an existing one.
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe what you need to accomplish and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Describe what would help and any workarounds you have tried.
